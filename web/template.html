<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전국 공연시설 가동률 (2025)</title>
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --page: #f9f9f7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --gridline: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --accent: #2a78d6;
    --accent-fill-100: #cde2fb;
    --accent-fill-400: #3987e5;
    --accent2-400: #c2790a;
    --closed-bg: #f6dcdc;
    --closed-fg: #a32a2a;
    --hover-wash: rgba(42,120,214,0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --page: #0d0d0d;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --gridline: #2c2c2a;
      --baseline: #383835;
      --border: rgba(255,255,255,0.10);
      --accent: #3987e5;
      --accent-fill-100: #184f95;
      --accent-fill-400: #2a78d6;
      --accent2-400: #e0973a;
      --closed-bg: #4a1f22;
      --closed-fg: #f0a4a4;
      --hover-wash: rgba(57,135,229,0.14);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --page: #0d0d0d;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --gridline: #2c2c2a;
    --baseline: #383835;
    --border: rgba(255,255,255,0.10);
    --accent: #3987e5;
    --accent-fill-100: #184f95;
    --accent-fill-400: #2a78d6;
    --accent2-400: #e0973a;
    --closed-bg: #4a1f22;
    --closed-fg: #f0a4a4;
    --hover-wash: rgba(57,135,229,0.14);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--text-primary);
  }
  header.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    background: var(--surface-1);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    gap: 10px;
  }
  .brand { font-size: 17px; font-weight: 700; }
  .brand .year-badge {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-fill-100);
    padding: 2px 8px;
    border-radius: 10px;
    margin-left: 6px;
  }
  .brand a { color: inherit; text-decoration: none; }
  .brand a:hover { text-decoration: underline; }
  .brand .year-select { font-family: inherit; border: 0; cursor: pointer; padding: 2px 4px; }
  .brand .year-select:focus-visible { outline: 2px solid var(--accent); }
  nav.tabs { display: flex; gap: 4px; }
  .tab-btn {
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-size: 14px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
  }
  .tab-btn:hover { background: var(--hover-wash); }
  .tab-btn.active { background: var(--accent); color: #fff; }

  .breadcrumb {
    padding: 10px 20px;
    font-size: 13px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 4px;
    flex-wrap: wrap;
  }
  .breadcrumb button {
    border: none;
    background: transparent;
    color: var(--accent);
    font-size: 13px;
    cursor: pointer;
    padding: 2px 4px;
  }
  .breadcrumb button:hover { text-decoration: underline; }
  .breadcrumb .sep { color: var(--text-muted); }
  .breadcrumb .current { color: var(--text-primary); font-weight: 600; }

  main#app { padding: 8px 20px 60px; max-width: 1000px; margin: 0 auto; }

  h2.view-title { font-size: 18px; margin: 10px 0 14px; }
  p.hint { color: var(--text-secondary); font-size: 13px; margin: 0 0 16px; }

  /* 실제 시도 경계를 단순화한 SVG 지도 + 옆의 목록. 지도/목록 어느 쪽을 클릭해도 동일하게 동작합니다. */
  .map-layout {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    align-items: flex-start;
    margin-bottom: 16px;
  }
  .korea-svg {
    width: 100%;
    max-width: 360px;
    flex-shrink: 0;
    overflow: visible;
  }
  .map-region {
    stroke: var(--surface-1);
    stroke-width: 1.2;
    cursor: pointer;
    transition: opacity 0.1s;
  }
  .map-region:hover, .map-region.hover { opacity: 0.7; stroke: var(--accent); stroke-width: 2; }

  .facility-dot {
    fill: #e0303f;
    stroke: var(--surface-1);
    stroke-width: 0.5;
    cursor: pointer;
    opacity: 0.85;
    transition: opacity 0.1s;
  }
  .facility-dot:hover { opacity: 1; stroke: #e0303f; }

  .region-legend {
    flex: 1;
    min-width: 300px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-auto-flow: column;
    gap: 4px 12px;
  }
  .legend-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    padding: 7px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
  }
  .legend-row:hover, .legend-row.hover { background: var(--hover-wash); }
  .legend-row .r-name { font-weight: 600; }
  .legend-row .r-count { color: var(--text-secondary); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .legend-row .r-sub { flex-basis: 100%; margin: 2px 0 0 18px; font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; }

  .metric-toggle { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 12px; }
  .metric-label { font-size: 12px; color: var(--text-muted); margin-right: 4px; }
  .metric-btn {
    padding: 5px 12px;
    font-size: 12px;
    font-family: inherit;
    color: var(--text-secondary);
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 14px;
    cursor: pointer;
  }
  .metric-btn:hover { border-color: var(--accent); }
  .metric-btn.active { color: #fff; background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .legend-row .r-swatch { width: 10px; height: 10px; border-radius: 2px; margin-right: 8px; display: inline-block; vertical-align: middle; }

  .region-box {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    text-align: center;
    padding: 8px 14px;
  }
  .region-box:hover { border-color: var(--accent); background: var(--hover-wash); }
  .region-box .r-name { font-size: 13px; font-weight: 700; }
  .region-box .r-count { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .unmatched-note { margin-top: 10px; }

  .search-box {
    width: 100%;
    max-width: 320px;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface-1);
    color: var(--text-primary);
    font-size: 14px;
    margin-bottom: 14px;
  }

  .facility-list { display: flex; flex-direction: column; gap: 8px; }
  .facility-card {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    cursor: pointer;
  }
  .facility-card:hover { border-color: var(--accent); background: var(--hover-wash); }
  .facility-card .f-name { font-weight: 600; font-size: 14px; }
  .facility-card .f-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .facility-card .f-meta { font-size: 12px; color: var(--text-secondary); text-align: right; }

  .info-card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 18px;
  }
  .info-card .f-name { font-size: 16px; font-weight: 700; }
  .info-card .f-sub { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

  table.hall-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.hall-table th, table.hall-table td {
    text-align: left;
    padding: 9px 10px;
    border-bottom: 1px solid var(--gridline);
  }
  table.hall-table th { color: var(--text-muted); font-weight: 600; font-size: 12px; }
  table.hall-table tbody tr { cursor: pointer; }
  table.hall-table tbody tr:hover { background: var(--hover-wash); }
  .rate-cell { display: flex; align-items: center; gap: 8px; min-width: 140px; }
  .rate-bar-track { flex: 1; height: 6px; background: var(--gridline); border-radius: 3px; overflow: hidden; }
  .rate-bar-fill { height: 100%; background: var(--accent-fill-400); border-radius: 3px; }
  .calendar-bar-fill { background: var(--accent2-400); }
  .rate-num { font-variant-numeric: tabular-nums; width: 44px; text-align: right; flex-shrink: 0; }
  .occ-note { font-size: 11px; color: var(--text-muted); margin-top: 10px; }

  .perf-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
    background: var(--accent-fill-100);
    color: var(--accent);
    white-space: nowrap;
  }
  .perf-badge-empty {
    background: transparent;
    color: var(--text-muted);
    font-weight: 400;
    padding: 2px 8px 2px 0;
  }
  .unmatched-perf-link {
    margin-top: 8px;
    font-size: 12px;
    color: var(--text-muted);
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
    width: fit-content;
  }
  .unmatched-perf-link:hover { color: var(--accent); }

  .perf-note, .calendar-unavailable-note {
    background: var(--accent-fill-100);
    color: var(--text-primary);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    margin-bottom: 14px;
  }
  table.perf-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.perf-table th, table.perf-table td {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid var(--gridline);
  }
  table.perf-table th { color: var(--text-muted); font-weight: 600; font-size: 12px; }
  .closed-badge {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 7px;
    font-size: 11px;
    font-weight: 600;
    color: var(--closed-fg);
    background: var(--closed-bg);
    border-radius: 8px;
    vertical-align: middle;
    white-space: nowrap;
  }
  .closed-note { font-size: 12px; color: var(--closed-fg); margin-top: 6px; }
  .pad-days { display: block; font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .summary-note { margin: -14px 0 16px; }
  .state-badge {
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 8px;
    background: var(--gridline);
    color: var(--text-secondary);
    white-space: nowrap;
  }

  .about-body { max-width: 640px; line-height: 1.7; font-size: 14px; }
  .about-body h3 { font-size: 15px; margin: 20px 0 6px; }
  .about-body ul { margin: 4px 0; padding-left: 20px; }
  .about-body li { margin: 4px 0; }
  .about-body .source { color: var(--text-muted); font-size: 12px; margin-top: 24px; }

  .empty-msg { color: var(--text-muted); font-size: 14px; padding: 30px 0; text-align: center; }

  body, header.topbar, .facility-card, .info-card, .region-box, .stat-tile, .search-box, .sort-select {
    transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }
  .facility-card, .region-box, .legend-row { transition: background-color 0.15s ease, border-color 0.15s ease, opacity 0.15s ease; }
  .map-region { transition: opacity 0.15s ease, stroke 0.15s ease, stroke-width 0.15s ease; }
  .rate-bar-fill { transition: width 0.6s ease; }

  @keyframes viewFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  #app.view-enter { animation: viewFade 0.22s ease; }

  .topbar-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .global-search { position: relative; width: 220px; }
  .global-search .search-box { width: 100%; max-width: none; margin-bottom: 0; }
  .search-results {
    display: none;
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    max-height: 320px;
    overflow-y: auto;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    z-index: 20;
  }
  .search-results.open { display: block; }
  .search-result-row {
    padding: 8px 12px;
    cursor: pointer;
    font-size: 13px;
    border-bottom: 1px solid var(--gridline);
  }
  .search-result-row:last-child { border-bottom: none; }
  .search-result-row:hover, .search-result-row.hover { background: var(--hover-wash); }
  .search-result-row .f-name { font-weight: 600; }
  .search-result-row .f-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .search-result-empty { padding: 10px 12px; font-size: 13px; color: var(--text-muted); }
  .theme-toggle-btn {
    border: 1px solid var(--border);
    background: var(--surface-1);
    color: var(--text-secondary);
    font-size: 14px;
    line-height: 1;
    padding: 7px 10px;
    border-radius: 8px;
    cursor: pointer;
  }
  .theme-toggle-btn:hover { background: var(--hover-wash); border-color: var(--accent); }

  .list-controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .list-controls .search-box { margin-bottom: 0; }
  .sort-select {
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface-1);
    color: var(--text-primary);
    font-size: 13px;
  }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 26px; }
  .stat-tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .stat-tile .s-label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  .stat-tile .s-value { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat-tile-clickable { cursor: pointer; }
  .stat-tile-clickable:hover { border-color: var(--accent); background: var(--hover-wash); }

  .rank-section { margin-bottom: 28px; }
  .rank-section h3 { font-size: 15px; margin: 0 0 10px; }
  table.rank-table .rank-num { width: 26px; color: var(--text-muted); font-weight: 700; }
  table.rank-table .ticket-num { font-variant-numeric: tabular-nums; font-weight: 600; }

  th[data-sort] { cursor: pointer; user-select: none; }
  th[data-sort]:hover { color: var(--text-primary); }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><a id="brandLink" href="../index.html" title="공연시장 동향(메인)으로">전국 공연시설 가동률</a><span class="year-badge" id="yearBadge">2025</span></div>
  <div class="topbar-controls">
    <div class="global-search">
      <input type="text" id="globalSearch" class="search-box" placeholder="전체 시설 검색" autocomplete="off">
      <div id="globalSearchResults" class="search-results"></div>
    </div>
    <nav class="tabs">
      <button class="tab-btn" data-tab="summary">요약</button>
      <button class="tab-btn" data-tab="map">지역지도</button>
      <button class="tab-btn" data-tab="about">이 도구에 대해</button>
    </nav>
    <button id="themeToggle" class="theme-toggle-btn" type="button" title="다크모드 전환" aria-label="다크모드 전환">🌙</button>
  </div>
</header>
<div class="breadcrumb" id="breadcrumb"></div>
<main id="app"></main>

/* 시설별 실제 좌표 데이터가 없어(시도/구군명만 보유), 각 시설을 해당 시도 폴리곤
   내부의 한 점으로 결정적으로 배치한다. 같은 구군의 시설은 폴리곤 내부의 한
   앵커 지점 주변에 모이도록 해 대략적인 분포를 보여준다(실제 주소 기준 아님). */
function parsePathRings(d) {
  const rings = [];
  let current = null;
  (d.match(/[ML][^ML]*/g) || []).forEach((tok) => {
    const rest = tok.slice(1);
    const comma = rest.indexOf(",");
    const x = parseFloat(rest.slice(0, comma));
    const y = parseFloat(rest.slice(comma + 1));
    if (tok[0] === "M") {
      if (current) rings.push(current);
      current = [[x, y]];
    } else if (current) {
      current.push([x, y]);
    }
  });
  if (current) rings.push(current);
  return rings;
}
function ringArea(ring) {
  let a = 0;
  for (let i = 0; i < ring.length; i++) {
    const [x1, y1] = ring[i];
    const [x2, y2] = ring[(i + 1) % ring.length];
    a += x1 * y2 - x2 * y1;
  }
  return Math.abs(a / 2);
}
function ringBBox(ring) {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  ring.forEach(([x, y]) => {
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
  });
  return { minX, minY, maxX, maxY };
}
function pointInRing(x, y, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i], [xj, yj] = ring[j];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(seed) {
  let t = seed >>> 0;
  return function () {
    t += 0x6d2b79f5;
    let x = t;
    x = Math.imul(x ^ (x >>> 15), x | 1);
    x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}
function randomPointInRing(ring, bbox, rng, maxTries) {
  for (let i = 0; i < maxTries; i++) {
    const x = bbox.minX + rng() * (bbox.maxX - bbox.minX);
    const y = bbox.minY + rng() * (bbox.maxY - bbox.minY);
    if (pointInRing(x, y, ring)) return [x, y];
  }
  return [(bbox.minX + bbox.maxX) / 2, (bbox.minY + bbox.maxY) / 2];
}

const REGION_POLY = {};
REGION_ORDER.forEach((sido) => {
  const rings = parsePathRings(KOREA_MAP.paths[sido]);
  const main = rings.reduce((a, b) => (ringArea(b) > ringArea(a) ? b : a));
  REGION_POLY[sido] = { ring: main, bbox: ringBBox(main) };
});

const GUGUN_ANCHOR = {};
function gugunAnchor(sido, gugun) {
  const key = sido + "|" + gugun;
  if (key in GUGUN_ANCHOR) return GUGUN_ANCHOR[key];
  const poly = REGION_POLY[sido];
  const pt = poly ? randomPointInRing(poly.ring, poly.bbox, mulberry32(hashStr(key)), 200) : null;
  GUGUN_ANCHOR[key] = pt;
  return pt;
}

const FACILITY_PT = {};
function facilityPoint(f) {
  if (f.idx in FACILITY_PT) return FACILITY_PT[f.idx];
  if (f.mapX != null && f.mapY != null) return (FACILITY_PT[f.idx] = [f.mapX, f.mapY]);
  const poly = REGION_POLY[f.sido];
  if (!poly) return (FACILITY_PT[f.idx] = null);
  const anchor = gugunAnchor(f.sido, f.gugun);
  const rng = mulberry32(hashStr("facility:" + f.idx));
  const span = Math.min(poly.bbox.maxX - poly.bbox.minX, poly.bbox.maxY - poly.bbox.minY);
  const jitterR = Math.max(span * 0.045, 2.5);
  let pt = null;
  for (let i = 0; i < 40; i++) {
    const ang = rng() * Math.PI * 2;
    const rad = Math.sqrt(rng()) * jitterR;
    const x = anchor[0] + Math.cos(ang) * rad;
    const y = anchor[1] + Math.sin(ang) * rad;
    if (pointInRing(x, y, poly.ring)) { pt = [x, y]; break; }
  }
  return (FACILITY_PT[f.idx] = pt || anchor);
}

/* dataviz 스킬의 sequential blue 램프(100~500) — 시설 수가 많을수록 진하게 */
const SEQ_BLUE = ["#cde2fb", "#b7d3f6", "#9ec5f4", "#86b6ef", "#6da7ec", "#5598e7", "#3987e5", "#2a78d6", "#256abf"];
function seqColor(count, max) {
  if (max <= 0) return SEQ_BLUE[0];
  const t = Math.min(count / max, 1);
  return SEQ_BLUE[Math.round(t * (SEQ_BLUE.length - 1))];
}

}

/* 지역지도 색상·정렬 기준. 각 지표는 시도별 합계와 전국 대비 비율을 함께 보여준다. */
const MAP_METRICS = {
  facilities: { label: "시설 수", short: "시설", fmt: (n) => `${n.toLocaleString()}개` },
  tickets: { label: "티켓판매수", short: "티켓", fmt: (n) => `${n.toLocaleString()}매` },
  perf: { label: "공연 건수", short: "공연", fmt: (n) => `${n.toLocaleString()}건` },
};
let mapMetric = "facilities";

function regionStats() {
  const stats = {};
  const total = { facilities: 0, tickets: 0, perf: 0 };
  DATA.facilities.forEach((f) => {
    const s = (stats[f.sido] = stats[f.sido] || { facilities: 0, tickets: 0, perf: 0 });
    const tickets = f.halls.reduce((sum, h) => sum + (h.tickets || 0), 0);
    // 공연 건수는 관별로 배정된 공연 + 관 정보 없는 공연(f.perf)을 모두 센다.
    const perf = f.halls.reduce((sum, h) => sum + (h.perf || []).length, 0) + (f.perf || []).length;
    s.facilities += 1; s.tickets += tickets; s.perf += perf;
    total.facilities += 1; total.tickets += tickets; total.perf += perf;
  });
  return { stats, total };
}

function metricText(key, stat, total) {
  const v = stat[key];
  const pct = total[key] ? (v / total[key] * 100).toFixed(1) : "0.0";
  return `${MAP_METRICS[key].fmt(v)} (${pct}%)`;
}

  return `

    <p class="hint">${DATA.year}년 공연 실적이 있는 시설만 표시됩니다. 지도는 단순화된 경계라 실제 행정경계와 세부 형태가 다를 수 있습니다. 색이 진할수록 선택한 기준(${MAP_METRICS[mapMetric].label})의 값이 큽니다. 괄호 안은 전국 대비 비율입니다. 점(●)은 각 공연시설의 실제 주소 기준 위치입니다(KOPIS 상세정보에 주소가 없는 일부 시설은 소속 시도·구군 내의 임의 위치로 대체 표시됩니다) — 클릭하면 해당 시설로 이동합니다.</p>
    ${metricToggle}
    <div class="map-layout">
      <svg viewBox="0 0 ${KOREA_MAP.width} ${KOREA_MAP.height}" class="korea-svg">${paths}${dots}</svg>
      <div class="region-legend" style="grid-template-rows: repeat(${legendRows}, auto);">${legend}</div>
    </div>
    ${unmatchedHtml}
  `;
}

function bestOcc(f) {
  const vals = f.halls.map((h) => h.occ).filter((v) => v != null);
  return vals.length ? Math.max(...vals) : -1;
}

function sortFacilities(list, sortKey) {
  const arr = list.slice();
  if (sortKey === "rateDesc") arr.sort((a, b) => bestOcc(b) - bestOcc(a));
  else if (sortKey === "rateAsc") arr.sort((a, b) => bestOcc(a) - bestOcc(b));
  else arr.sort((a, b) => a.name.localeCompare(b.name, "ko"));
  return arr;
}

function computeFacilityList() {
  const q = state.facilityQuery.trim();
  let list = state.tab === "facilities" ? DATA.facilities.slice() : facilitiesBySido(state.sido);
  if (q) list = list.filter((f) => f.name.includes(q));
  return sortFacilities(list, state.facilitySort);
}

function renderFacilityList(sido) {
  const total = facilitiesBySido(sido).length;
  const list = computeFacilityList();
  return `
    <h2 class="view-title">${esc(sido)} 공연시설 (${total}개)</h2>
    <div class="list-controls">
      <input type="text" class="search-box" id="fsearch" placeholder="시설명 검색" value="${esc(state.facilityQuery)}">
      <select class="sort-select" id="fsort">
        <option value="name"${state.facilitySort === "name" ? " selected" : ""}>이름순</option>
        <option value="rateDesc"${state.facilitySort === "rateDesc" ? " selected" : ""}>좌석점유율 높은순</option>
        <option value="rateAsc"${state.facilitySort === "rateAsc" ? " selected" : ""}>좌석점유율 낮은순</option>
      </select>
    </div>
    <div class="facility-list" id="flist">${list.map((f) => facilityCardHtml(f, false)).join("") || `<div class="empty-msg">검색 결과가 없습니다.</div>`}</div>
  `;
}

function renderAllFacilities() {
  const total = DATA.facilities.length;

  return `
    <h2 class="view-title">전국 공연시설 (${total}개)</h2>

      <select class="sort-select" id="fsort">
        <option value="name"${state.facilitySort === "name" ? " selected" : ""}>이름순</option>
        <option value="rateDesc"${state.facilitySort === "rateDesc" ? " selected" : ""}>좌석점유율 높은순</option>
        <option value="rateAsc"${state.facilitySort === "rateAsc" ? " selected" : ""}>좌석점유율 낮은순</option>
      </select>
    </div>
    <div class="facility-list" id="flist">${list.map((f) => facilityCardHtml(f, true)).join("") || `<div class="empty-msg">검색 결과가 없습니다.</div>`}</div>
  `;
}

function computeAllHallsList() {
  const q = state.hallsQuery.trim();
  let halls = [];
  DATA.facilities.forEach((f) => f.halls.forEach((h) => halls.push({ ...h, facility: f.name, sido: f.sido, idx: f.idx, closed: f.closed })));
  if (q) halls = halls.filter((h) => h.name.includes(q) || h.facility.includes(q));
  const { key, dir } = state.hallsSort;
  if (key) {
    halls.sort((a, b) => {
      if (key === "name" || key === "facility") return dir * String(a[key]).localeCompare(String(b[key]), "ko");
      const av = a[key] == null ? -Infinity : a[key];
      const bv = b[key] == null ? -Infinity : b[key];
      return dir * (av - bv);
    });
  }
  return halls;
}

function hallsSortArrow(key) {
  if (state.hallsSort.key !== key) return "";
  return `<span class="sort-arrow">${state.hallsSort.dir === 1 ? "▲" : "▼"}</span>`;
}

function allHallRowHtml(h) {

    <td>
      <div class="f-name">${esc(h.name)}</div>

    </table>
  `;
}

function facilityCardHtml(f, showSido) {
  const rate = bestOcc(f);
  const sub = showSido ? `${esc(f.sido)} ${esc(f.gugun || "")} · 관 ${f.halls.length}개` : `${esc(f.gugun || "")} · 관 ${f.halls.length}개`;
  return `<div class="facility-card" data-facility="${f.idx}">
    <div>
      <div class="f-name">${esc(f.name)}${closedBadge(f.closed)}</div>
      <div class="f-sub">${sub}</div>
    </div>
    <div class="f-meta">최고 좌석점유율<br>${rate >= 0 ? rate.toFixed(1) + "%" : "산출 불가"}</div>
  </div>`;
}

function sortHalls(halls, sort) {
  if (!sort.key) return halls;
  const arr = halls.slice();
  arr.sort((a, b) => {
    if (sort.key === "name") return sort.dir * String(a.name).localeCompare(String(b.name), "ko");
    const av = a[sort.key] == null ? -Infinity : a[sort.key];
    const bv = b[sort.key] == null ? -Infinity : b[sort.key];
    return sort.dir * (av - bv);
  });
  return arr;
}

function sortArrow(key) {
  if (state.hallSort.key !== key) return "";
  return `<span class="sort-arrow">${state.hallSort.dir === 1 ? "▲" : "▼"}</span>`;
}

function parseKopisDate(s) {
  if (!s) return null;
  const parts = s.split(".");
  if (parts.length !== 3) return null;
  const d = new Date(Date.UTC(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2])));
  return isNaN(d.getTime()) ? null : d;
}
function perfDays(p) {
  const start = parseKopisDate(p.from), end = parseKopisDate(p.to);
  if (!start || !end) return null;
  const days = Math.round((end - start) / 86400000) + 1;
  return days > 0 ? days : null;
}

function renderPerformances(f, hallIdx) {
  const hall = hallIdx != null ? f.halls[hallIdx] : null;
  const perf = ((hall ? hall.perf : f.perf) || []).slice().sort((a, b) => (a.from || "").localeCompare(b.from || ""));
  const rows = perf.map((p) => {
    const days = perfDays(p);
    const occ = p.occDays == null ? "" : p.occDays === 0
      ? `<span class="pad-days">점유 0일 · 다른 공연 기간과 겹침</span>`
      : `<span class="pad-days">준비·철수 포함 점유 ${p.occDays}일</span>`;
    return `
    <tr>
      <td>${esc(p.name)}</td>
      <td>${esc(p.from)} ~ ${esc(p.to)}${days ? ` (${days}일)` : ""}${occ}</td>
      <td>${esc(p.genre)}</td>
      <td><span class="state-badge">${esc(p.state)}</span></td>
    </tr>`;
  }).join("");

  const summary = hall && hall.occupiedDays != null ? `
    <div class="stat-grid">
      <div class="stat-tile"><div class="s-label">공연기간 합계 (${DATA.year}년분, 겹침 제외)</div><div class="s-value">${hall.runDays.toLocaleString()}일</div></div>
      <div class="stat-tile"><div class="s-label">준비 ${DATA.setupDays}일·철수 ${DATA.teardownDays}일 포함</div><div class="s-value">${hall.occupiedDays.toLocaleString()}일</div></div>
      <div class="stat-tile"><div class="s-label">캘린더가동률 (÷${DATA.yearDays}일)</div><div class="s-value">${hall.calendarOcc.toFixed(1)}%</div></div>
    </div>
    <p class="occ-note summary-note">각 공연의 앞 ${DATA.setupDays}일(준비)·뒤 ${DATA.teardownDays}일(철수)도 관을 점유한 것으로 일괄 가정한 값입니다(KOPIS에 실제 준비·철수 기간 정보는 없음). 같은 날은 한 번만 세고, 연도 밖으로 걸친 공연은 ${DATA.year}년분만 계산합니다. 공연 행마다 적은 점유일은 겹치는 날을 한 번만 배정한 값(실제 공연일을 먼저, 남는 날에 준비·철수를 시작일 순으로)이라 모두 더하면 위의 점유일과 같습니다.</p>` : "";

  const title = hall
    ? `${esc(f.name)} · ${esc(hall.name)} · ${DATA.year}년 공연목록 (${perf.length}건)`
    : `${esc(f.name)} · 관 정보 없는 공연 (${perf.length}건)`;
  const note = hall
    ? ""
    : `<div class="perf-note">이 공연들은 KOPIS 공연 상세정보에 관(공연장) 정보가 없거나 이 시설의 관 목록과 매칭되지 않아, 어느 관인지 특정할 수 없습니다.</div>`;

  return `
    ${note}
    <h2 class="view-title">${title}</h2>
    ${summary}
    <table class="perf-table">
      <thead><tr><th>공연명</th><th>기간</th><th>장르</th><th>상태</th></tr></thead>
      <tbody>${rows || `<tr><td colspan="4" class="empty-msg">공연 기록이 없습니다.</td></tr>`}</tbody>
    </table>
  `;
}

function computeSummaryStats() {
  const halls = [];
  DATA.facilities.forEach((f) => f.halls.forEach((h) => halls.push({ ...h, facility: f.name, sido: f.sido, idx: f.idx, closed: f.closed, hallCount: f.halls.length })));
  const occs = halls.filter((h) => h.occ != null).map((h) => h.occ);
  const avg = (arr) => (arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0);
  return {
    facilityCount: DATA.facilities.length,
    hallCount: halls.length,
    avgOcc: avg(occs),
    topTickets: halls.filter((h) => h.tickets > 0).sort((a, b) => b.tickets - a.tickets).slice(0, 10),
  };
}

}

      <h3>알려진 한계</h3>
      <ul>
        <li><strong>캘린더가동률(%)</strong>은 정확한 실제 가동일수가 아니라 <strong>추정치</strong>입니다. KOPIS Open API가 관별 실제 공연 날짜 목록을 제공하지 않아, 대신 공연 상세정보의 상연기간(시작~종료)을 그 관이 해당 공연에 배정된 기간으로 보고, 각 공연 앞 ${DATA.setupDays}일(준비)·뒤 ${DATA.teardownDays}일(철수)을 일괄로 더한 뒤 여러 공연의 기간을 합집합(중복 제외)해 연간 일수로 나눴습니다. 런 기간 중 쉬는 요일이 있어도 그 기간 전체를 점유한 것으로 세고, 준비·철수 기간은 KOPIS에 없는 값이라 모든 공연에 같게 가정했으므로 실제와 차이가 있을 수 있습니다(특히 하루짜리 공연이 많은 관은 높게 나옵니다).</li>
        <li>공연목록은 <strong>관(공연장) 단위로 구분</strong>해 표시합니다. KOPIS 공연 상세정보에 관 정보가 없거나 이 시설의 관 목록과 매칭되지 않는 일부 공연은 "관 정보 없음"으로 별도 표시됩니다.</li>
        <li><strong>폐관</strong> 배지는 KOPIS 시설 목록에서 시설명에 "(폐관)"·"[폐관]"이 붙은 시설에 표시합니다. KOPIS에는 폐관 여부나 폐관 시점을 알려주는 항목이 따로 없어서, 현재 기준으로 폐관이라는 뜻일 뿐 해당 연도에 이미 닫혀 있었다는 뜻은 아닙니다.</li>
        <li>시설의 주소·지역·관(공연장) 목록은 연도별 자료가 아니라 <strong>현재 KOPIS 시설 정보</strong>를 기준으로 합니다. 그래서 이후에 이름이 바뀌거나 사라진 관의 공연은 "관 정보 없음"으로 분류되는 경우가 있고, 과거 연도일수록 더 많습니다.</li>
        <li>시설명 매칭에 실패한 일부 시설은 <strong>"지역 미상"</strong>으로 별도 표시됩니다.</li>
        <li>지도 경계는 단순화된 것으로, 실제 행정경계와 세부 형태가 다를 수 있습니다.</li>
      </ul>
      <div class="source">출처: KOPIS(공연예술통합전산망) Open API · 이 페이지는 서버 없이 동작하는 오프라인 파일입니다.</div>
    </div>
  `;
}

function hashFromState(s) {
  if (s.tab === "about") return "#/about";
  if (s.tab === "summary") return "#/summary";
  if (s.tab === "facilities") return "#/facilities";
  if (s.tab === "halls") return s.hallsSort && s.hallsSort.key ? `#/halls/${s.hallsSort.key}` : "#/halls";
  if (!s.sido) return "#/regions";
  if (s.facilityIdx == null) return `#/region/${encodeURIComponent(s.sido)}`;
  if (s.hallIdx != null) return `#/facility/${s.facilityIdx}/hall/${s.hallIdx}/perf`;
  if (!s.showPerf) return `#/facility/${s.facilityIdx}`;
  return `#/facility/${s.facilityIdx}/perf`;
}

function stateFromHash(hash) {
  const parts = (hash || "").replace(/^#\/?/, "").split("/").filter(Boolean);
  const s = {
    tab: "summary", sido: null, facilityIdx: null, showPerf: false, hallIdx: null,
    facilityQuery: "", facilitySort: "name", hallSort: { key: null, dir: 1 },
    hallsQuery: "", hallsSort: { key: null, dir: 1 },
  };
  if (parts[0] === "about") { s.tab = "about"; return s; }
  if (parts[0] === "facilities") { s.tab = "facilities"; return s; }
  if (parts[0] === "halls") {
    s.tab = "halls";
    if (parts[1]) s.hallsSort = { key: decodeURIComponent(parts[1]), dir: -1 };
    return s;
  }
  if (parts[0] === "regions") { s.tab = "map"; return s; }
  if (parts[0] === "region" && parts[1]) { s.tab = "map"; s.sido = decodeURIComponent(parts[1]); return s; }
  if (parts[0] === "facility" && parts[1] != null) {
    const idx = Number(parts[1]);
    const f = DATA.facilities[idx];
    if (f) {
      s.tab = "map"; s.facilityIdx = idx; s.sido = f.sido;
      if (parts[2] === "hall" && parts[3] != null && f.halls[Number(parts[3])]) {
        s.hallIdx = Number(parts[3]);
        s.showPerf = true;
      } else {
        s.showPerf = parts[2] === "perf";
      }
      return s;
    }
  }
  return s;
}

function setHash(hash) {
  if (location.hash === hash) applyHash();
  else location.hash = hash;
}

function applyHash() {
  state = stateFromHash(location.hash);
  if (state.tab === "map") lastMapHash = hashFromState(state);
  render();
}

function animateBars() {
  requestAnimationFrame(() => {
    document.querySelectorAll(".rate-bar-fill[data-w]").forEach((el) => {
      el.style.width = el.dataset.w + "%";
    });
  });
}

function render() {
  document.querySelectorAll(".tab-btn").forEach((b) => {
    b.classList.toggle("active", b.dataset.tab === state.tab);
  });
  setBreadcrumb();
  const app = document.getElementById("app");

  let html;
  if (state.tab === "about") html = renderAbout();
  else if (state.tab === "summary") html = renderSummary();
  else if (state.tab === "facilities") html = renderAllFacilities();
  else if (state.tab === "halls") html = renderAllHalls();
  else if (!state.sido) html = renderRegions();
  else if (state.facilityIdx == null) html = renderFacilityList(state.sido);
  else {
    const f = DATA.facilities[state.facilityIdx];
    html = state.showPerf ? renderPerformances(f, state.hallIdx) : renderFacilityDetail(f);
  }

  app.classList.remove("view-enter");
  void app.offsetWidth;
  app.innerHTML = html;
  app.classList.add("view-enter");

  if (state.tab === "map" && state.sido && state.facilityIdx == null) attachListControls(false);
  else if (state.tab === "facilities") attachListControls(true);
  else if (state.tab === "halls") attachHallsListControls();
  animateBars();
}

function attachListControls(showSido) {
  const input = document.getElementById("fsearch");
  const select = document.getElementById("fsort");
  const update = () => {
    const list = computeFacilityList();
    document.getElementById("flist").innerHTML = list.map((f) => facilityCardHtml(f, showSido)).join("") || `<div class="empty-msg">검색 결과가 없습니다.</div>`;
  };
  if (input) input.addEventListener("input", () => { state.facilityQuery = input.value; update(); });
  if (select) select.addEventListener("change", () => { state.facilitySort = select.value; update(); });
}

function attachHallsListControls() {
  const input = document.getElementById("hsearch");
  if (!input) return;
  input.addEventListener("input", () => {
    state.hallsQuery = input.value;
    const list = computeAllHallsList();
    document.getElementById("hallsTbody").innerHTML = list.map(allHallRowHtml).join("") || `<tr><td colspan="5" class="empty-msg">검색 결과가 없습니다.</td></tr>`;
  });
}

function systemPrefersDark() {
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
}
function applyTheme() {
  if (userTheme) document.documentElement.setAttribute("data-theme", userTheme);
  else document.documentElement.removeAttribute("data-theme");
  const btn = document.getElementById("themeToggle");
  if (btn) {
    const effectiveDark = userTheme ? userTheme === "dark" : systemPrefersDark();
    btn.textContent = effectiveDark ? "☀️" : "🌙";
  }
}
function toggleTheme() {
  const effectiveDark = userTheme ? userTheme === "dark" : systemPrefersDark();
  userTheme = effectiveDark ? "light" : "dark";
  localStorage.setItem("kopis-theme", userTheme);
  applyTheme();
}

document.addEventListener("click", (e) => {
  if (e.target.closest("#themeToggle")) { toggleTheme(); return; }

  const tabBtn = e.target.closest(".tab-btn");
  if (tabBtn) {
    const tab = tabBtn.dataset.tab;
    setHash(tab === "map" ? lastMapHash : `#/${tab}`);
    return;
  }

  const metricBtn = e.target.closest("[data-map-metric]");
  if (metricBtn) { mapMetric = metricBtn.dataset.mapMetric; render(); return; }

  const nav = e.target.closest("[data-nav]");
  if (nav) {
    const target = nav.dataset.nav;
    if (target === "regions") setHash("#/regions");
    else if (target === "facilities") setHash(`#/region/${encodeURIComponent(state.sido)}`);
    else if (target === "facility") setHash(`#/facility/${state.facilityIdx}`);
    else if (target === "summary") setHash("#/summary");
    else if (target === "all-facilities") setHash("#/facilities");
    else if (target === "all-halls") setHash("#/halls");
    else if (target === "all-halls-occ") setHash("#/halls/occ");
    return;
  }

  const sortTh = e.target.closest("th[data-sort]");
  if (sortTh) {
    const key = sortTh.dataset.sort;
    if (state.hallSort.key === key) state.hallSort.dir *= -1;
    else { state.hallSort.key = key; state.hallSort.dir = key === "name" ? 1 : -1; }
    render();
    return;
  }

  const sortHallsTh = e.target.closest("th[data-sort-halls]");
  if (sortHallsTh) {
    const key = sortHallsTh.dataset.sortHalls;
    if (state.hallsSort.key === key) state.hallsSort.dir *= -1;
    else { state.hallsSort.key = key; state.hallsSort.dir = (key === "name" || key === "facility") ? 1 : -1; }
    render();
    return;
  }

  const regionBox = e.target.closest("[data-region]");
  if (regionBox) { setHash(`#/region/${encodeURIComponent(regionBox.dataset.region)}`); return; }

  const facilityCard = e.target.closest("[data-facility]");
  if (facilityCard) {
    setHash(`#/facility/${facilityCard.dataset.facility}`);
    if (facilityCard.closest("#globalSearchResults")) {
      globalSearchInput.value = "";
      globalSearchResults.classList.remove("open");
      globalSearchResults.innerHTML = "";
    }
    return;
  }

  const hallRow = e.target.closest("tr[data-hall]");
  if (hallRow) { setHash(`#/facility/${state.facilityIdx}/hall/${hallRow.dataset.hall}/perf`); return; }

  const unmatchedLink = e.target.closest("[data-unmatched-perf]");
  if (unmatchedLink) { setHash(`#/facility/${state.facilityIdx}/perf`); return; }
});

function syncRegionHover(sido, on) {
  document.querySelectorAll(`[data-region="${CSS.escape(sido)}"]`).forEach((el) => {
    el.classList.toggle("hover", on);
  });
}
document.addEventListener("mouseover", (e) => {
  const el = e.target.closest(".map-region, .legend-row");
  if (el) syncRegionHover(el.dataset.region, true);
});
document.addEventListener("mouseout", (e) => {
  const el = e.target.closest(".map-region, .legend-row");
  if (el) syncRegionHover(el.dataset.region, false);
});

const globalSearchInput = document.getElementById("globalSearch");
const globalSearchResults = document.getElementById("globalSearchResults");

function globalSearchMatches(query) {
  const q = query.trim();
  if (!q) return [];
  return DATA.facilities.filter((f) => f.name.includes(q)).slice(0, 8);
}

function renderGlobalSearchResults(query) {
  const q = query.trim();
  if (!q) { globalSearchResults.classList.remove("open"); globalSearchResults.innerHTML = ""; return; }
  const matches = globalSearchMatches(query);
  globalSearchResults.innerHTML = matches.length
    ? matches.map((f) => `<div class="search-result-row" data-facility="${f.idx}">
        <div class="f-name">${esc(f.name)}${closedBadge(f.closed)}</div>
        <div class="f-sub">${esc(f.sido)} ${esc(f.gugun || "")} · 관 ${f.halls.length}개</div>
      </div>`).join("")
    : `<div class="search-result-empty">검색 결과가 없습니다.</div>`;
  globalSearchResults.classList.add("open");
}

globalSearchInput.addEventListener("input", () => renderGlobalSearchResults(globalSearchInput.value));
globalSearchInput.addEventListener("focus", () => renderGlobalSearchResults(globalSearchInput.value));
document.addEventListener("click", (e) => {
  if (!e.target.closest(".global-search")) {
    globalSearchResults.classList.remove("open");
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    globalSearchResults.classList.remove("open");
    globalSearchInput.blur();
  }
});

/* 연도 선택: 연도별 페이지(web/<연도>/index.html)로 이동한다. */
(function initYearSelect() {
  document.title = `전국 공연시설 가동률 (${DATA.year})`;
  const brandLink = document.getElementById("brandLink");
  if (brandLink && DATA.mainHref) brandLink.setAttribute("href", DATA.mainHref);
  const badge = document.getElementById("yearBadge");
  if (!badge || !DATA.years) return;
  const sel = document.createElement("select");
  sel.id = "yearSelect";
  sel.className = "year-badge year-select";
  sel.setAttribute("aria-label", "연도 선택");
  sel.innerHTML = DATA.years.map((y) => `<option value="${esc(y.href)}"${y.year === DATA.year ? " selected" : ""}>${y.year}년</option>`).join("");
  sel.addEventListener("change", () => { location.href = sel.value; });
  badge.replaceWith(sel);
})();

window.addEventListener("hashchange", applyHash);
applyTheme();
if (!location.hash) history.replaceState(null, "", "#/summary");
applyHash();
</script>
